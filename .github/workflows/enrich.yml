name: Enrich QGIS Dashboard exports

on:
  push:
    paths:
      - "raw/**.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enrich every raw export into dashboards/
        run: |
          mkdir -p dashboards
          for f in raw/*.html; do
            name=$(basename "$f")
            echo "Enriqueciendo $f -> dashboards/$name"
            python3 scripts/enrich_dashboard.py "$f" "dashboards/$name"
          done

      - name: Rebuild the landing page (index.html)
        run: |
          python3 scripts/generate_index.py dashboards/ index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboards index.html
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Auto-enrich dashboards + actualiza índice"
          git push
